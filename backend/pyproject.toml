[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carepath-api"
version = "0.1.0"
description = "CarePath treatment plan coordination MVP"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.161,<1",
  "starlette>=1.9,<2",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.9,<1",
  "pip-audit>=2.7,<3",
  "bandit>=1.8,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carepath"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240"]
"migrations/versions/*" = ["E501", "I001", "UP007", "UP035"]