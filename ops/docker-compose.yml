name: carepath

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carepath
      POSTGRES_USER: carepath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carepath-demo-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carepath -d carepath"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  minio:
    # 官方 minio/minio 镜像已从公共仓库下架；使用维护中的等价打包镜像。
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-carepath}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-carepath-demo-secret}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: ../backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://carepath:${POSTGRES_PASSWORD:-carepath-demo-password}@postgres:5432/carepath
      SECRET_KEY: ${SECRET_KEY:-local-demo-secret-key-change-me-123456}
      CORS_ORIGINS: http://localhost:8080
      SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  web:
    build:
      context: ../apps/web
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres-data:
  redis-data:
  minio-data:
