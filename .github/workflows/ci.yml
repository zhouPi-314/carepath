name: CI

on:
  push:
    branches: [feature/ycth-mvp, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./carepath-test.db
          SECRET_KEY: test-secret-key-with-at-least-32-characters
        run: python -m pytest -q
      - name: Run ruff
        run: python -m ruff check src tests migrations

  web:
    name: Web test + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Build production bundle
        run: pnpm build

  wechat:
    name: WeChat miniprogram check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wechat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        run: npm test
      - name: Run syntax checks
        run: npm run check

  android-logic:
    name: Android logic module JUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run pure logic module tests
        run: ./gradlew :logic:test --no-daemon
