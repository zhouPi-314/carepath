name: CI

on:
  push:
    branches: [feature/ycth-mvp, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./carepath-test.db
          SECRET_KEY: test-secret-key-with-at-least-32-characters
        run: python -m pytest -q
      - name: Run ruff
        run: python -m ruff check src tests migrations scripts

  postgres-smoke:
    name: PostgreSQL smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carepath
          POSTGRES_PASSWORD: carepath-smoke
          POSTGRES_DB: carepath_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carepath -d carepath_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run PostgreSQL smoke
        env:
          CAREPATH_SMOKE_DATABASE_URL: postgresql+asyncpg://carepath:carepath-smoke@127.0.0.1:5432/carepath_smoke
        run: python scripts/postgres_smoke.py

  web:
    name: Web test + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack (pnpm version pinned in package.json)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Build production bundle
        run: pnpm build

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack
        run: corepack enable
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Remove stale E2E database
        run: rm -f backend/carepath-e2e.db
      - name: Run Playwright flows
        working-directory: apps/web
        run: pnpm test:e2e

  wechat:
    name: WeChat miniprogram check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wechat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        run: npm test
      - name: Run syntax checks
        run: npm run check

  android-logic:
    name: Android build + JUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Run pure logic module tests
        run: ./gradlew :logic:test --no-daemon -Dorg.gradle.configureondemand=true
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
